<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پیام‌رسان من</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ================================
       صفحه ورود / ثبت‌نام
       ================================ -->
  <div id="auth-container">
    <h2>ورود / ثبت‌نام</h2>
    
    <input type="email" id="email" placeholder="ایمیل">
    <input type="password" id="password" placeholder="رمز عبور">
    <input type="text" id="username" placeholder="نام کاربری (فقط برای ثبت‌نام)">

    <button id="signup-btn">ثبت‌نام</button>
    <button id="login-btn">ورود</button>
  </div>

  <!-- ================================
       برنامه اصلی (چت)
       ================================ -->
  <div id="app-container" class="hidden">
    
    <!-- نوار کناری -->
    <div class="sidebar">
      
      <!-- اطلاعات کاربر -->
      <div class="user-info">
        <span id="current-username">کاربر</span>
        <button id="logout-btn">خروج</button>
      </div>

      <!-- افزودن دوست -->
      <div class="add-friend">
        <input type="text" id="friend-username" placeholder="نام کاربری دوست...">
        <button id="add-friend-btn">افزودن</button>
      </div>

      <!-- لیست دوستان -->
      <h3>گفتگوها</h3>
      <ul id="friends-list">
        <!-- دوستان به صورت دینامیک اضافه می‌شوند -->
      </ul>

    </div>

    <!-- منطقه چت -->
    <div class="chat-area">
      
      <!-- هدر چت -->
      <div id="chat-header">
        <span id="chat-title">یک گفتگو را انتخاب کنید</span>
      </div>

      <!-- لیست پیام‌ها -->
      <div id="messages-list">
        <!-- پیام‌ها اینجا قرار می‌گیرند -->
      </div>

      <!-- ورودی ارسال پیام -->
      <div class="message-input">
        <input type="text" id="message-text" placeholder="پیام خود را بنویسید...">
        <button id="send-btn">ارسال</button>
      </div>

    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
