<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>پیام‌رسان من</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>


<body>


  <!-- =====================================
       LOGIN / REGISTER
  ====================================== -->

  <div
    id="auth-container"
    class="auth-page"
  >

    <div class="auth-box">

      <div class="auth-logo">
        💬
      </div>

      <h1>
        پیام‌رسان من
      </h1>

      <p class="auth-subtitle">
        وارد حساب خود شوید
      </p>


      <input
        type="email"
        id="email"
        placeholder="ایمیل"
        autocomplete="email"
      >


      <input
        type="password"
        id="password"
        placeholder="رمز عبور"
        autocomplete="current-password"
      >


      <input
        type="text"
        id="username"
        placeholder="نام کاربری (فقط برای ثبت‌نام)"
      >


      <button
        class="primary-btn"
        onclick="signIn()"
      >
        ورود
      </button>


      <button
        class="secondary-btn"
        onclick="signUp()"
      >
        ایجاد حساب
      </button>

    </div>

  </div>



  <!-- =====================================
       MAIN APP
  ====================================== -->

  <div
    id="app-container"
    class="messenger hidden"
  >


    <!-- =================================
         SIDEBAR
    ================================== -->

    <aside class="sidebar">


      <!-- USER HEADER -->

      <div class="sidebar-header">


        <div class="profile-area">


          <div class="my-avatar">
            👤
          </div>


          <div class="my-info">

            <strong id="current-username">
              کاربر
            </strong>

            <span>
              آنلاین
            </span>

          </div>

        </div>


        <button
          class="logout-btn"
          onclick="signOut()"
          title="خروج"
        >
          ⎋
        </button>

      </div>



      <!-- SEARCH -->

      <div class="search-box">

        <span>
          🔎
        </span>

        <input
          type="text"
          id="search-friends"
          placeholder="جستجوی کاربران..."
          oninput="searchFriends()"
        >

      </div>



      <!-- ADD FRIEND -->

      <div class="add-friend">

        <input
          type="text"
          id="friend-username"
          placeholder="نام کاربری"
        >


        <button
          onclick="sendFriendRequest()"
          title="افزودن کاربر"
        >
          +
        </button>

      </div>



      <!-- SECTION -->

      <div class="section-title">
        گفتگوها
      </div>



      <!-- FRIENDS -->

      <ul id="friends-list"></ul>


    </aside>



    <!-- =================================
         CHAT AREA
    ================================== -->

    <main class="chat-area">


      <!-- EMPTY CHAT -->

      <div
        id="empty-chat"
        class="empty-chat"
      >

        <div class="empty-icon">
          💬
        </div>

        <h2>
          پیام‌رسان من
        </h2>

        <p>
          یک گفتگو را انتخاب کنید
        </p>

      </div>



      <!-- CHAT -->

      <div
        id="chat-content"
        class="chat-content hidden"
      >


        <!-- CHAT HEADER -->

        <div class="chat-header">


          <!-- MOBILE BACK BUTTON -->

          <button
            class="mobile-back"
            onclick="closeMobileChat()"
            title="بازگشت"
          >
            ←
          </button>



          <div class="chat-user">


            <div class="chat-avatar">
              👤
            </div>


            <div>

              <strong id="chat-header">
                کاربر
              </strong>

              <span>
                آنلاین
              </span>

            </div>


          </div>


        </div>



        <!-- MESSAGES -->

        <div id="messages-list"></div>



        <!-- MESSAGE INPUT -->

        <div
          id="input-box"
          class="message-input hidden"
        >


          <input
            type="text"
            id="message-text"
            placeholder="پیام خود را بنویسید..."
            onkeydown="handleMessageKey(event)"
            autocomplete="off"
          >


          <button
            onclick="sendMessage()"
            title="ارسال"
          >
            ➤
          </button>


        </div>


      </div>


    </main>


  </div>



  <!-- APP JS -->

  <script src="app.js"></script>


</body>

</html>
