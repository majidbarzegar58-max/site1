<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پیام‌رسان آنلاین</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ۱. بخش ورود و ثبت‌نام -->
  <div id="auth-container" class="container">
    <h2>ورود / ثبت‌نام</h2>
    
    <input type="text" id="username" placeholder="نام کاربری (برای ثبت‌نام)">
    <input type="email" id="email" placeholder="ایمیل">
    <input type="password" id="password" placeholder="رمز عبور">

    <div class="btn-group">
      <button type="button" onclick="signIn()">ورود</button>
      <button type="button" onclick="signUp()">ثبت‌نام</button>
    </div>
  </div>

  <!-- ۲. بخش اصلی پیام‌رسان -->
  <div id="app-container" class="container hidden">
    <div class="header">
      <span>خوش آمدید <b id="current-username"></b></span>
      <button onclick="signOut()" class="logout-btn">خروج</button>
    </div>

    <div class="chat-layout">
      <!-- لیست دوستان -->
      <div class="sidebar">
        <h3>افزودن دوست</h3>
        <div class="add-friend-box">
          <input type="text" id="friend-username" placeholder="آیدی دوست...">
          <button onclick="sendFriendRequest()">+</button>
        </div>

        <h3>دوستان شما</h3>
        <ul id="friends-list"></ul>
      </div>

      <!-- صفحه چت -->
      <div class="chat-area">
        <h3 id="chat-header">یک دوست را برای چت انتخاب کنید</h3>
        
        <div id="messages-list" class="messages-box"></div>

        <div id="input-box" class="input-area hidden">
          <input type="text" id="message-text" placeholder="پیام خود را بنویسید...">
          <button onclick="sendMessage()">ارسال</button>
        </div>
      </div>
    </div>
  </div>

  <!-- فراخوانی کتابخانه Supabase و فایل app.js -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>

</body>
</html>
