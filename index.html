<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>پیام‌رسان من</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div id="auth-container" class="card">
    <h2>ورود / ثبت‌نام</h2>
    <input type="email" id="email" placeholder="ایمیل">
    <input type="password" id="password" placeholder="رمز عبور">
    <input type="text" id="username" placeholder="نام کاربری (فقط برای ثبت‌نام)">
    <button onclick="signUp()">ثبت‌نام</button>
    <button onclick="signIn()">ورود</button>
  </div>

  <div id="app-container" class="hidden">
    <div class="sidebar">
      <div class="user-info">
        <span id="current-username"></span>
        <button onclick="signOut()">خروج</button>
      </div>
      <div class="add-friend">
        <input type="text" id="friend-username" placeholder="نام کاربری دوست">
        <button onclick="sendFriendRequest()">افزودن</button>
      </div>
      <h3>دوستان من</h3>
      <ul id="friends-list"></ul>
    </div>
    
    <div class="chat-area">
      <div id="chat-header">یک دوست را برای چت انتخاب کنید</div>
      <div id="messages-list"></div>
      <div class="message-input hidden" id="input-box">
        <input type="text" id="message-text" placeholder="پیام خود را بنویسید...">
        <button onclick="sendMessage()">ارسال</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
