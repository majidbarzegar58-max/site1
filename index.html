<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پیام‌رسان آنلاین</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ۱. فرم ورود و ثبت‌نام -->
  <div id="auth-container">
    <h2>ورود / ثبت‌نام</h2>
    
    <input type="text" id="username" placeholder="نام کاربری (برای ثبت‌نام)">
    <input type="email" id="email" placeholder="ایمیل">
    <input type="password" id="password" placeholder="رمز عبور">

    <button type="button" onclick="signIn()">ورود</button>
    <button type="button" onclick="signUp()" style="margin-top: 10px; background: rgba(255,255,255,0.1); box-shadow: none;">ثبت‌نام</button>
  </div>

  <!-- ۲. بخش اصلی پیام‌رسان -->
  <div id="app-container" class="hidden">
    
    <!-- سیدبار باریک سمت راست -->
    <div class="sidebar">
      <div class="user-info">
        <span id="current-username">کاربر</span>
        <button onclick="signOut()">خروج</button>
      </div>

      <div class="add-friend">
        <input type="text" id="friend-username" placeholder="آیدی دوست...">
        <button onclick="sendFriendRequest()">+</button>
      </div>

      <h3>دوستان شما</h3>
      <ul id="friends-list"></ul>
    </div>

    <!-- منطقه اصلی چت -->
    <div class="chat-area">
      <div id="chat-header">یک دوست را برای چت انتخاب کنید</div>
      
      <div id="messages-list"></div>

      <div id="input-box" class="message-input hidden">
        <input type="text" id="message-text" placeholder="پیام خود را بنویسید...">
        <button onclick="sendMessage()">ارسال</button>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
